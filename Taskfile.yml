# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  PROJECT_NAME: trails-logos

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Install workspace dependencies
    cmds:
      - pnpm install

  typecheck:
    desc: Run strict TypeScript checks across all workspace packages
    cmds:
      - pnpm typecheck

  test:
    desc: Run all tests (TypeScript workspace + Rust LEZ contract)
    cmds:
      - pnpm test
      - cd lez && cargo test

  dev:
    desc: Automatically clean up port 8095 and run the API server directly with tsx
    cmds:
      - bunx kill-port 8095
      - pnpm dev -- {{.CLI_ARGS}}

  demo:
    desc: Run the official trails.logos v0.1.0 reproducible acceptance demonstration
    cmds:
      - pnpm demo

  cli:
    desc: Run trails-logos CLI with arguments (e.g. task cli -- --help)
    cmds:
      - pnpm trails-logos {{.CLI_ARGS}}
